<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{{subject}}</title>
  <style>
    /* Reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #e0e0e0;
      -webkit-font-smoothing: antialiased;
    }
    .email-wrapper {
      width: 100%;
      background-color: #0a0a0a;
      padding: 40px 16px;
    }
    .email-container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #111111;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
    }
    /* Header */
    .email-header {
      background: linear-gradient(135deg, #1a1a1a 0%, #0f0f0f 100%);
      padding: 36px 40px;
      text-align: center;
      border-bottom: 1px solid #2a2a2a;
    }
    .brand-name {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: 8px;
      color: #ffffff;
      text-transform: uppercase;
      text-decoration: none;
    }
    .brand-tagline {
      font-size: 11px;
      letter-spacing: 4px;
      color: #888888;
      text-transform: uppercase;
      margin-top: 6px;
    }
    /* Body */
    .email-body {
      padding: 40px 40px 32px;
    }
    /* Footer */
    .email-footer {
      padding: 24px 40px;
      border-top: 1px solid #1e1e1e;
      background-color: #0d0d0d;
      text-align: center;
    }
    .footer-text {
      font-size: 12px;
      color: #555555;
      line-height: 1.8;
    }
    .footer-link {
      color: #888888;
      text-decoration: none;
    }
    /* Typography helpers */
    h1 { font-size: 22px; font-weight: 700; color: #ffffff; margin-bottom: 16px; }
    h2 { font-size: 18px; font-weight: 600; color: #ffffff; margin-bottom: 12px; }
    p  { color: #b0b0b0; margin-bottom: 16px; }
    .accent { color: #ffffff; font-weight: 600; }
    /* Divider */
    .divider {
      border: none;
      border-top: 1px solid #2a2a2a;
      margin: 28px 0;
    }
    /* Button */
    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: #ffffff;
      color: #000000 !important;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 6px;
      margin: 8px 0;
    }
    /* Table */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    .data-table th {
      text-align: left;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #666666;
      padding: 10px 0;
      border-bottom: 1px solid #2a2a2a;
    }
    .data-table td {
      padding: 12px 0;
      color: #c0c0c0;
      border-bottom: 1px solid #1a1a1a;
      vertical-align: top;
    }
    .data-table td.label { color: #777777; width: 40%; }
    .data-table td.value { color: #e0e0e0; font-weight: 500; }
    .data-table td.amount { color: #ffffff; font-weight: 700; text-align: right; }
    /* Total row */
    .total-row td { border-top: 2px solid #3a3a3a !important; border-bottom: none !important; padding-top: 16px !important; }
    .total-row .label { color: #ffffff !important; font-weight: 700; font-size: 16px; }
    .total-row .amount { color: #ffffff !important; font-size: 16px; }
    /* Badge */
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background-color: #1e2e1e;
      border: 1px solid #2d4a2d;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #4caf50;
    }
    @media only screen and (max-width: 480px) {
      .email-body { padding: 28px 24px; }
      .email-header { padding: 28px 24px; }
      .email-footer { padding: 20px 24px; }
    }
  </style>
</head>
<body>
<div class="email-wrapper">
  <div class="email-container">
    <div class="email-header">
      <div class="brand-name">DIZCO</div>
      <div class="brand-tagline">Contemporary Editorial Fashion</div>
    </div>
    <div class="email-body">
      {{body}}
    </div>
    <div class="email-footer">
      <p class="footer-text">
        &copy; 2026 DIZCO. All rights reserved.<br/>
        You received this email because you have an account with us.<br/>
        <a href="{{frontend_url}}" class="footer-link">Visit DIZCO</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
