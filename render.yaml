# =============================================================================
# DIZCO — Render Deployment Configuration
# https://render.com/docs/render-yaml
#
# To deploy:
#   1. Push this repository to GitHub
#   2. Create a new Render account / log in at render.com
#   3. Click "New Blueprint" and connect the GitHub repo
#   4. Render will auto-detect this file and deploy the backend service
#   5. Add environment variables in the Render dashboard under "Environment"
# =============================================================================

services:
  - type: web
    name: dizco-api
    runtime: python
    region: singapore          # Change to your nearest region: oregon, frankfurt, ohio, etc.
    plan: starter              # free | starter | standard
    rootDir: server            # All commands run relative to server/
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health

    # ── Environment Variables ─────────────────────────────────────────────────
    # NEVER hardcode real secret values here.
    # Use Render's "Environment" tab to set real production values.
    # The entries below show which variables are required and their types.
    envVars:
      - key: ENVIRONMENT
        value: production

      # Set this in Render dashboard: a 32+ character random secret
      # Generate with: openssl rand -hex 32
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value

      # Your managed PostgreSQL URL — set via Render dashboard
      # Format: postgresql://user:password@hostname:5432/dizco_prod
      - key: DATABASE_URL
        fromDatabase:
          name: dizco-db
          property: connectionString

      # Frontend URL for CORS and email links — set in Render dashboard
      - key: FRONTEND_BASE_URL
        sync: false                  # Must be set manually in dashboard

      - key: ALLOWED_ORIGINS
        sync: false                  # e.g. https://dizco.vercel.app

      # ── Razorpay ─────────────────────────────────────────────────────────────
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # ── Cloudinary ───────────────────────────────────────────────────────────
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ── SMTP Email ───────────────────────────────────────────────────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_FROM_NAME
        value: DIZCO
      - key: SMTP_USE_TLS
        value: "true"

databases:
  - name: dizco-db
    databaseName: dizco_prod
    user: dizco
    plan: starter              # free | starter | standard
    region: singapore          # Must match the service region above
